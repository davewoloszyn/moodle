issueNumber: MDL-62843
notes:
  core:
    - message: >-
        A new hook, \core\hook\admin\user_deletion_confirmation_text, has been
        added to allow plugins to extend user deletion confirmation messaging.
        The hook is dispatched by \core\user::get_deletion_confirmation_text() in
        public/lib/classes/user.php. Plugins can append HTML to the confirmation
        dialog by registering a callback in db/hooks.php and calling
        $hook->add_html($html).
      type: improved
